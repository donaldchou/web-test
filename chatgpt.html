<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>chatgpt碼錶 Stopwatch</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", "Noto Sans TC", sans-serif;
      background: linear-gradient(135deg, #111827, #1f2937);
      color: #fff;
    }

    .stopwatch {
      width: min(90%, 520px);
      padding: 48px 36px;
      text-align: center;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0 0 28px;
      font-size: 32px;
      letter-spacing: 4px;
    }

    .display {
      margin-bottom: 36px;
      font-family: Consolas, "Courier New", monospace;
      font-size: clamp(48px, 12vw, 76px);
      font-weight: 700;
      letter-spacing: 3px;
      font-variant-numeric: tabular-nums;
    }

    .buttons {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      min-width: 120px;
      padding: 14px 24px;
      border: 0;
      border-radius: 14px;
      color: #fff;
      background: #374151;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: transform .15s, opacity .15s, background .15s;
    }

    button:hover {
      transform: translateY(-2px);
      opacity: .9;
    }

    button:active {
      transform: translateY(0);
    }

    #start { background: #16a34a; }
    #pause { background: #d97706; }
    #reset { background: #dc2626; }

    button:disabled {
      opacity: .4;
      cursor: not-allowed;
      transform: none;
    }

    @media (max-width: 420px) {
      .stopwatch { padding: 36px 20px; }
      button { flex: 1; min-width: 100px; }
    }
  </style>
</head>
<body>
  <main class="stopwatch">
    <h1>chatgpt碼錶</h1>
    <div class="display" id="display">00:00:00.00</div>

    <div class="buttons">
      <button id="start">開始</button>
      <button id="pause" disabled>暫停</button>
      <button id="reset">重置</button>
    </div>
  </main>

  <script>
    let startTime = 0;
    let elapsedTime = 0;
    let timerId = null;

    const display = document.getElementById("display");
    const startBtn = document.getElementById("start");
    const pauseBtn = document.getElementById("pause");
    const resetBtn = document.getElementById("reset");

    function formatTime(ms) {
      const hours = Math.floor(ms / 3600000);
      const minutes = Math.floor((ms % 3600000) / 60000);
      const seconds = Math.floor((ms % 60000) / 1000);
      const centiseconds = Math.floor((ms % 1000) / 10);

      return [
        String(hours).padStart(2, "0"),
        String(minutes).padStart(2, "0"),
        String(seconds).padStart(2, "0")
      ].join(":") + "." + String(centiseconds).padStart(2, "0");
    }

    function updateDisplay() {
      elapsedTime = performance.now() - startTime;
      display.textContent = formatTime(elapsedTime);
    }

    function start() {
      if (timerId !== null) return;

      startTime = performance.now() - elapsedTime;
      timerId = setInterval(updateDisplay, 10);

      startBtn.disabled = true;
      pauseBtn.disabled = false;
    }

    function pause() {
      if (timerId === null) return;

      clearInterval(timerId);
      timerId = null;
      elapsedTime = performance.now() - startTime;
      display.textContent = formatTime(elapsedTime);

      startBtn.disabled = false;
      pauseBtn.disabled = true;
    }

    function reset() {
      clearInterval(timerId);
      timerId = null;
      startTime = 0;
      elapsedTime = 0;
      display.textContent = "00:00:00.00";

      startBtn.disabled = false;
      pauseBtn.disabled = true;
    }

    startBtn.addEventListener("click", start);
    pauseBtn.addEventListener("click", pause);
    resetBtn.addEventListener("click", reset);
  </script>
</body>
</html>
