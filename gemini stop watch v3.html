<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neumorphic 碼錶</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #EBF0F2;
            color: #5F7176;
        }

        /* Neumorphic 凸起效果 (按鈕、盤面外圈) */
        .neu-flat {
            background: #EBF0F2;
            box-shadow:  12px 12px 24px #cbd2d5,
                        -12px -12px 24px #ffffff;
        }

        /* Neumorphic 凹陷效果 (錶盤內部) */
        .neu-inset {
            background: #EBF0F2;
            box-shadow: inset 8px 8px 16px #cbd2d5,
                        inset -8px -8px 16px #ffffff;
        }

        /* 左側按鈕：莫蘭迪綠色與立體陰影 */
        .btn-green {
            background-color: #85B39B;
            box-shadow: 6px 6px 14px rgba(133, 179, 155, 0.4),
                        -4px -4px 10px rgba(255, 255, 255, 0.8);
            transition: all 0.15s ease;
        }
        .btn-green:hover:not(:disabled) {
            background-color: #79A78F;
            transform: translateY(-1px);
            box-shadow: 8px 8px 18px rgba(133, 179, 155, 0.5),
                        -4px -4px 12px rgba(255, 255, 255, 0.9);
        }
        .btn-green:active:not(:disabled) {
            transform: translateY(1px);
            box-shadow: inset 3px 3px 6px rgba(0, 0, 0, 0.2);
        }

        /* 右側按鈕：莫蘭迪紅色與立體陰影 */
        .btn-red {
            background-color: #E07A7F;
            box-shadow: 6px 6px 14px rgba(224, 122, 127, 0.4),
                        -4px -4px 10px rgba(255, 255, 255, 0.8);
            transition: all 0.15s ease;
        }
        .btn-red:hover:not(:disabled) {
            background-color: #D46F74;
            transform: translateY(-1px);
            box-shadow: 8px 8px 18px rgba(224, 122, 127, 0.5),
                        -4px -4px 12px rgba(255, 255, 255, 0.9);
        }
        .btn-red:active:not(:disabled) {
            transform: translateY(1px);
            box-shadow: inset 3px 3px 6px rgba(0, 0, 0, 0.2);
        }

        /* 禁用狀態按鈕風格 */
        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            box-shadow: none !important;
            transform: none !important;
        }

        /* SVG 動態進度條動畫 smooth transition */
        .progress-ring {
            transition: stroke-dashoffset 0.05s linear;
            transform-origin: 50% 50%;
            transform: rotate(-90deg);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="flex flex-col items-center justify-center w-full max-w-sm space-y-10 py-6">
        
        <!-- 大型圓形碼錶盤主體 -->
        <div class="relative w-72 h-72 sm:w-80 sm:h-80 rounded-full neu-flat flex items-center justify-center p-4">
            
            <!-- 錶盤內圈凹陷層 -->
            <div class="w-full h-full rounded-full neu-inset relative flex flex-col items-center justify-center p-2">
                
                <!-- SVG 圓形刻度與進度條 -->
                <svg class="absolute inset-0 w-full h-full p-2" viewBox="0 0 200 200">
                    <!-- 環形軌道背景色 -->
                    <circle cx="100" cy="100" r="88" fill="none" stroke="#DDE5E8" stroke-width="12"/>

                    <!-- 右半部/全局刻度線組 (利用 JS 動態產生或預載) -->
                    <g id="ticksGroup" stroke="#5F7176" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
                        <!-- 刻度線會由下方 JS 自動繪製，預設 60 條刻度 -->
                    </g>

                    <!-- 動態柔和莫蘭迪綠色進度條 (#B0BFC3) -->
                    <circle id="progressCircle" 
                            cx="100" cy="100" r="88" 
                            fill="none" 
                            stroke="#B0BFC3" 
                            stroke-width="13" 
                            stroke-dasharray="552.92" 
                            stroke-dashoffset="276.46" 
                            stroke-linecap="round"
                            class="progress-ring" />
                </svg>

                <!-- 中央數字時間顯示與文字 -->
                <div class="z-10 flex flex-col items-center justify-center text-center select-none">
                    <h1 id="timerDisplay" class="text-4xl sm:text-5xl font-semibold tracking-tight text-[#5F7176] drop-shadow-sm font-mono">
                        00:00:00
                    </h1>
                    <span class="mt-2 text-base sm:text-lg font-medium tracking-widest text-[#5F7176] opacity-90">
                        分:秒:毫秒
                    </span>
                </div>
            </div>
        </div>

        <!-- 按鈕控制區域 -->
        <div class="flex items-center justify-center space-x-6 w-full px-2">
            
            <!-- 左側按鈕：開始 / 暫停 / 繼續 -->
            <button id="startPauseBtn" class="btn-green text-white font-medium text-lg px-7 py-3 rounded-xl flex items-center justify-center space-x-2.5 w-36 transition-all duration-200">
                <svg id="startIcon" class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <svg id="pauseIcon" class="w-5 h-5 fill-current hidden" viewBox="0 0 24 24">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
                <span id="btnText">開始</span>
            </button>

            <!-- 右側按鈕：重設 -->
            <button id="resetBtn" disabled class="btn-red text-white font-medium text-lg px-7 py-3 rounded-xl flex items-center justify-center space-x-2.5 w-36 transition-all duration-200">
                <svg class="w-5 h-5 fill-none stroke-current stroke-[2.5]" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="7"/>
                </svg>
                <span>重設</span>
            </button>

        </div>
    </div>

    <script>
        // 狀態與計時變數
        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval = null;
        let isRunning = false;

        // SVG 圓環參數
        const radius = 88;
        const circumference = 2 * Math.PI * radius; // 約 552.92

        // 取得 DOM 元素
        const displayEl = document.getElementById('timerDisplay');
        const startPauseBtn = document.getElementById('startPauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const btnText = document.getElementById('btnText');
        const startIcon = document.getElementById('startIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const progressCircle = document.getElementById('progressCircle');
        const ticksGroup = document.getElementById('ticksGroup');

        // 初始化繪製刻度盤 (60個小垂直線)
        function generateTicks() {
            const totalTicks = 60;
            let ticksHTML = '';
            for (let i = 0; i < totalTicks; i++) {
                const angle = (i * 6) * (Math.PI / 180);
                const innerR = 82;
                const outerR = 88;
                const x1 = 100 + innerR * Math.sin(angle);
                const y1 = 100 - innerR * Math.cos(angle);
                const x2 = 100 + outerR * Math.sin(angle);
                const y2 = 100 - outerR * Math.cos(angle);
                ticksHTML += `<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" />`;
            }
            ticksGroup.innerHTML = ticksHTML;
        }

        // 將毫秒轉換為 分:秒:毫秒 (如 00:15:37)
        function formatTime(ms) {
            const minutes = Math.floor((ms % 3600000) / 60000);
            const seconds = Math.floor((ms % 60000) / 1000);
            const milliseconds = Math.floor((ms % 1000) / 10); // 前兩位毫秒

            const pad = (num) => String(num).padStart(2, '0');
            return `${pad(minutes)}:${pad(seconds)}:${pad(milliseconds)}`;
        }

        // 更新畫面顯示與進度條
        function updateDisplay() {
            displayEl.textContent = formatTime(elapsedTime);

            // 環形進度條計算：以每 60 秒為一圈循環 (也可呈現靜態 half-ring 當時間為0時)
            if (elapsedTime === 0) {
                // 設為設計圖風格（左半邊實心，右半邊刻度）
                progressCircle.style.strokeDashoffset = circumference / 2;
            } else {
                const cycleMs = 60000; // 60 秒一圈
                const progressRatio = (elapsedTime % cycleMs) / cycleMs;
                const offset = circumference * (1 - progressRatio);
                progressCircle.style.strokeDashoffset = offset;
            }
        }

        // 更新按鈕圖示與文字UI
        function setButtonState(state) {
            if (state === 'STARTING' || state === 'RESUMING') {
                btnText.textContent = '暫停';
                startIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
                resetBtn.disabled = false;
            } else if (state === 'PAUSED') {
                btnText.textContent = '繼續';
                startIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
            } else if (state === 'RESET') {
                btnText.textContent = '開始';
                startIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
                resetBtn.disabled = true;
            }
        }

        // 開始 / 繼續 計時
        function startTimer() {
            startTime = Date.now() - elapsedTime;
            timerInterval = setInterval(() => {
                elapsedTime = Date.now() - startTime;
                updateDisplay();
            }, 10);
            isRunning = true;
        }

        // 暫停計時
        function pauseTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            isRunning = false;
        }

        // 主按鈕 (開始 / 暫停 / 繼續) 點擊事件處理
        startPauseBtn.addEventListener('click', () => {
            const currentText = btnText.textContent;

            if (currentText === '開始') {
                startTimer();
                setButtonState('STARTING');
            } else if (currentText === '暫停') {
                pauseTimer();
                setButtonState('PAUSED');
            } else if (currentText === '繼續') {
                startTimer();
                setButtonState('RESUMING');
            }
        });

        // 重設按鈕點擊事件處理
        resetBtn.addEventListener('click', () => {
            pauseTimer();
            elapsedTime = 0;
            updateDisplay();
            setButtonState('RESET');
        });

        // 頁面初始化
        window.onload = function() {
            generateTicks();
            updateDisplay();
        };
    </script>
</body>
</html>
